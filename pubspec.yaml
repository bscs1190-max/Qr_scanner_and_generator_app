name: qr_scanner_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.3.3
  curved_navigation_bar: ^1.0.6
  mobile_scanner: ^7.2.0
  url_launcher: ^6.3.2
  qr_scanner_overlay: ^0.0.2

  # Hive Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  qr: ^3.0.2
  image: ^4.9.1
  gal: ^2.3.2
  path_provider: ^2.1.6
  share_plus: ^13.2.0
  provider: ^6.1.2
  shared_preferences: ^2.3.4



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive Code Generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_final.png"
  adaptive_icon_background: "#F8F3E9"
  adaptive_icon_foreground: "assets/images/app_icon_final.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/